version: 2
updates:
  # pnpm dependencies. Update PRs are gated by the existing blocking CI
  # (lint-and-test, branch protection on main) — a red update PR just doesn't
  # merge, no separate gate needed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    # The stack is pinned by CLAUDE.md (Next 15 / React 19). A framework major is
    # a migration with its own ClickUp task, never a dependency bump that rides
    # along in a grouped PR — one such major silently poisons the whole group and
    # blocks every safe bump in it. Minor/patch keeps flowing.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Confirmed breakers (PR #264, 2026-08-12): zod v4 dropped
      # invalid_type_error (src/features/auth/schemas.ts); stripe v22 changed
      # the pinned apiVersion literal type (stripe-adapter.ts,
      # stripe-webhook.ts). Both need a dedicated migration task, not a
      # grouped bump.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      # Confirmed breaker (PR #241, 2026-08-12): TypeScript 7 is explicitly
      # rejected by Next 15.5's own typescript-setup guard, which fails
      # `next lint` outright regardless of what else is in the group.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
