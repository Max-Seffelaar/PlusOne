version: 2
updates:
  # pnpm dependencies. Update PRs are gated by the existing blocking CI
  # (lint-and-test, branch protection on main) — a red update PR just doesn't
  # merge, no separate gate needed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # ONE PR per week carrying every safe (minor/patch) bump (PLU-118,
    # 2026-10-15). The previous shape grouped by dependency-type (dev/prod),
    # which put majors and minor/patch bumps in the same PR: one major that
    # breaks CI poisons the whole group — #512 (@sentry/nextjs 11 broke
    # next.config.js) and #513 (eslint 10 broke `next lint`) held 29 safe
    # updates hostage, next and supabase-js patches among them.
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # No automatic major PRs at all. A major is a migration with its own Linear
    # issue (PLU-15 for Next 16 / React), never a bump that rides along.
    # Confirmed breakers that led here: zod 4 + stripe 22 (#264), typescript 7
    # (#241), @sentry/nextjs 11 (#512), eslint 10 + eslint-config-next 16
    # (#513). Dependabot *alerts* (the Security tab) are not suppressed by an
    # ignore rule, so a vulnerability fixed only in a major stays visible — it
    # becomes a deliberate task instead of a surprise PR.
    #
    # MEASURED LIMIT of this rule — do not read it as airtight (z8uq9m0h2h,
    # 2026-09-18, docs/changelog.md). PR #291 bumped @types/react 18 -> 19 with
    # a per-package major ignore in place: the types rode along as a companion
    # of the react/react-dom update, on a path where ignore conditions are
    # never consulted. GitHub documents no such path and exposes no knob for
    # it. The control that actually stopped that PR was blocking CI, and that
    # stays the backstop here, not this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # One PR per week here too. Action majors are version-pin bumps with no code
  # impact so far (5 merged 2026-08-12, #511 2026-10-15) and stay included.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
