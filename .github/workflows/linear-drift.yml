# Daily Linear↔GitHub drift check (PLU-125), replacing the old ClickUp↔GitHub
# reconcile run. `scripts/linear-task.mjs drift` exits 1 on drift, so the run
# goes red and GitHub notifies Max. Read-only: fixing statuses stays a
# deliberate, commented action in a session. Without the LINEAR_API_KEY secret
# it skips with a notice instead of failing every day.
name: linear-drift

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Linear drift
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "::notice::LINEAR_API_KEY not set; skipping the drift check."
            exit 0
          fi
          node scripts/linear-task.mjs drift
