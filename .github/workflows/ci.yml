name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          # 22+: supabase-js ≥2.108 needs native WebSocket (Node 20 throws in
          # the client constructor — hit by the e2e helpers AND any server-side
          # client the dev server creates).
          node-version: 22
          cache: 'pnpm'

      # Fastest possible feedback on a migration timestamp collision (fails in
      # seconds, no dependencies installed yet) — catches the case a per-branch
      # check can't: two PRs each picking a free timestamp that only collides
      # once both land on main (86ey9e84m/86ey9e851, 13/7).
      - name: Check for migration timestamp collisions
        run: node scripts/hooks/check-migration-duplicates.mjs

      # Install + the pure-node suites go through the ONE setup script the
      # laptop and the Claude web SessionStart hook also run — a second inline
      # copy of these steps drifts from the local one, and then you debug
      # environment differences instead of code (26/8). The suite list lives in
      # the script and is validated against package.json before anything runs,
      # so a renamed/removed script fails as "list drifted", not as a
      # confusing mid-run pnpm error.
      - name: Install dependencies (shared session-setup script)
        run: node scripts/session-setup.mjs install

      - name: Lint, type-check, unit tests (shared session-setup script)
        run: node scripts/session-setup.mjs check

      # pgTAP RLS/trigger tests run against a real local Postgres started by the
      # Supabase CLI (migrations applied from supabase/migrations + seed).
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Full stack (db + auth + rest), not just `db start`: the e2e smoke needs
      # GoTrue for dev-login and PostgREST for the app + DB assertions. Services
      # disabled in supabase/config.toml (analytics, edge runtime…) stay off.
      - name: Start local Supabase stack
        run: supabase start

      # Wrapper, not bare `supabase test db`: pg_prove exits 0 on a file whose
      # plan() and assertion count have drifted apart, because pgTAP reports that
      # only as a TAP comment (86eykjgrb). scripts/db-test.mjs streams the normal
      # output through and turns that comment into a red build.
      - name: Run database tests (pgTAP)
        run: node scripts/db-test.mjs

      # Real cross-connection concurrency test for the quota/capacity/tier-max
      # trigger locking fix (86ey9e8ar) — needs two genuinely separate, racing
      # Postgres transactions, which a single-connection pgTAP file can't give
      # it (see the script's header comment for why dblink wasn't an option
      # against this project's local/CI Supabase image).
      - name: Run quota/capacity trigger concurrency test
        run: pnpm db:test:concurrency

      # STAP 4.3 — core-flow smoke with DB-state assertions (86ey7q6ze). One
      # deliberately small spec; Playwright boots `pnpm dev` itself (PORT=3000).
      - name: Provision .env.local from the running stack
        run: node scripts/dev-env.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke (Playwright)
        run: pnpm e2e:smoke

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders only — the clients read these at request time,
          # so static analysis just needs them present. Real values come from the
          # hosting env (Vercel) for actual deploys.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output
          path: .next/
          if-no-files-found: ignore

  # QA-1 — automated layout/visual suite (`pnpm e2e:layout`): every po screen ×
  # the device matrix in tests/e2e/layout/matrix.ts (overflow, ≥44px tap targets
  # on touch, 1024px chrome, console/network, Deur variant) + one full-page
  # screenshot per screen × device for human review. Deliberately NOT a
  # required check yet — Max decides that once it has been stable. Same stack
  # setup as lint-and-test: install through the ONE setup script, then the
  # same Supabase start + env provisioning steps.
  layout-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (shared session-setup script)
        run: node scripts/session-setup.mjs install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Provision .env.local from the running stack
        run: node scripts/dev-env.mjs

      # The documented local test-pass setup (`pnpm db:fresh` = reset + this):
      # stamps admin@'s fixed TOTP so dev-login lands at AAL2, and makes admin@
      # a platform admin so the Platform screens render real content. Never in
      # seed.sql (pgTAP relies on admin@ NOT being one) — and this job runs no
      # pgTAP, on its own fresh stack.
      - name: Prepare seed users (dev:mfa)
        run: pnpm dev:mfa

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run layout suite (Playwright)
        run: pnpm e2e:layout

      - name: Upload layout screenshots
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-screenshots
          path: layout-screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Link screenshots in the job summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          {
            echo "## QA-1 layout suite — screenshots"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "Full-page screenshot per screen × device (14 days): [layout-screenshots]($ARTIFACT_URL)"
            else
              echo "No screenshots were uploaded (the suite did not get far enough to take any)."
            fi
            if [ -d layout-screenshots ]; then
              echo ""
              echo "| Device | Screens |"
              echo "|---|---|"
              for d in layout-screenshots/*/; do
                echo "| $(basename "$d") | $(find "$d" -name '*.png' | wc -l) |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: layout-traces
          path: test-results/
          if-no-files-found: ignore

  # QA-0 flow screenshots (onboarding-orchestration-claude-code.md §1). Walks the
  # user flows in tests/flows/ on the four flow variants (desktop + phone browser,
  # phone + iPad inside the simulated native shell), screenshots every step, turns
  # the machine-answerable handoff questions into asserts, and publishes a contact
  # sheet. Path-gated INSIDE the job: `select.mjs` maps the changed files to the
  # flows that need them (registry: tests/flows/flows.mjs) — a README-only PR
  # selects nothing and every later step is skipped. Not a required check.
  flow-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only for the sticky PR comment, through the built-in GITHUB_TOKEN.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select flows for the changed paths
        id: select
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          node scripts/flow-shots/select.mjs --self-check
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            node scripts/flow-shots/select.mjs --base "$base" --head HEAD
          else
            # New branch / no usable base: run every flow.
            echo tests/flows/flows.mjs | node scripts/flow-shots/select.mjs
          fi

      - name: No flow-relevant change
        if: steps.select.outputs.flows == ''
        run: echo "QA-0 flow shots — no flow-relevant paths changed, no flows run." >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v6
        if: steps.select.outputs.flows != ''
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        if: steps.select.outputs.flows != ''
        with:
          node-version: 22
          cache: 'pnpm'

      # Same stack setup as `layout-suite`, minus `pnpm dev:mfa`: the flows run on
      # the plain seed (admin@ has no MFA factor there and MFA is optional), and
      # dev:mfa re-applies the 20260615000000 onboarding RPCs, which brings back
      # the dropped set_venue_plan(uuid,text,boolean) overload and breaks the
      # wizard's plan/trial step on that stack.
      - name: Install dependencies (shared session-setup script)
        if: steps.select.outputs.flows != ''
        run: node scripts/session-setup.mjs install

      - name: Setup Supabase CLI
        if: steps.select.outputs.flows != ''
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        if: steps.select.outputs.flows != ''
        run: supabase start

      - name: Provision .env.local from the running stack
        if: steps.select.outputs.flows != ''
        run: node scripts/dev-env.mjs

      - name: Install Playwright browser
        if: steps.select.outputs.flows != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Run flows (pnpm qa:flows)
        if: steps.select.outputs.flows != ''
        run: pnpm qa:flows ${{ steps.select.outputs.flows }}

      - name: Upload contact sheets
        id: sheets
        if: always() && steps.select.outputs.flows != ''
        uses: actions/upload-artifact@v7
        with:
          name: flow-contact-sheets
          path: |
            flow-screenshots/*/contact-sheet.png
            flow-screenshots/*/contact-sheet.html
            flow-screenshots/index.html
            flow-screenshots/summary.md
          retention-days: 14
          if-no-files-found: warn

      - name: Upload flow screenshots
        id: shots
        if: always() && steps.select.outputs.flows != ''
        uses: actions/upload-artifact@v7
        with:
          name: flow-screenshots
          path: flow-screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Write the job summary and the PR comment body
        if: always() && steps.select.outputs.flows != ''
        env:
          FLOWS: ${{ steps.select.outputs.flows }}
          SHEETS_URL: ${{ steps.sheets.outputs.artifact-url }}
          SHOTS_URL: ${{ steps.shots.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "<!-- qa-0-flow-shots -->"
            echo "## QA-0 flow shots — \`${SHA:0:7}\`"
            echo ""
            echo "Flows: \`$FLOWS\` · [run]($RUN_URL)"
            if [ -n "$SHEETS_URL" ]; then
              echo "- **Contact sheets** (one PNG per flow, every step × variant + the assert table): [flow-contact-sheets]($SHEETS_URL)"
              echo "- Every full-page screenshot + \`flow.json\`: [flow-screenshots]($SHOTS_URL)"
            else
              echo "- No screenshots were uploaded (the run did not get far enough to take any)."
            fi
            echo ""
            if [ -f flow-screenshots/summary.md ]; then cat flow-screenshots/summary.md; fi
            echo ""
            echo "✅ = answered by an assert in the flow · – = not applicable to that variant · · = not reached. Handoff convention: CLAUDE.md \"Per-screen test handoff\"."
          } > flow-comment.md
          cat flow-comment.md >> "$GITHUB_STEP_SUMMARY"

      # Sticky: one comment per PR, edited on every run. Fork PRs get a read-only
      # token, so a refused comment never fails the job — the summary above stays.
      - name: Post or update the PR comment
        if: always() && github.event_name == 'pull_request' && steps.select.outputs.flows != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- qa-0-flow-shots -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@flow-comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@flow-comment.md > /dev/null
          fi

      - uses: actions/upload-artifact@v7
        if: failure() && steps.select.outputs.flows != ''
        with:
          name: flow-traces
          path: test-results/flows/
          if-no-files-found: ignore
