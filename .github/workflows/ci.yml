name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm test

      # pgTAP RLS/trigger tests run against a real local Postgres started by the
      # Supabase CLI (migrations applied from supabase/migrations + seed).
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Full stack (db + auth + rest), not just `db start`: the e2e smoke needs
      # GoTrue for dev-login and PostgREST for the app + DB assertions. Services
      # disabled in supabase/config.toml (analytics, edge runtime…) stay off.
      - name: Start local Supabase stack
        run: supabase start

      - name: Run database tests (pgTAP)
        run: supabase test db

      # STAP 4.3 — core-flow smoke with DB-state assertions (86ey7q6ze). One
      # deliberately small spec; Playwright boots `pnpm dev` itself (PORT=3000).
      - name: Provision .env.local from the running stack
        run: node scripts/dev-env.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke (Playwright)
        run: pnpm e2e:smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders only — the clients read these at request time,
          # so static analysis just needs them present. Real values come from the
          # hosting env (Vercel) for actual deploys.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: .next/
          if-no-files-found: ignore
