name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          # 22+: supabase-js ≥2.108 needs native WebSocket (Node 20 throws in
          # the client constructor — hit by the e2e helpers AND any server-side
          # client the dev server creates).
          node-version: 22
          cache: 'pnpm'

      # Fastest possible feedback on a migration timestamp collision (fails in
      # seconds, no dependencies installed yet) — catches the case a per-branch
      # check can't: two PRs each picking a free timestamp that only collides
      # once both land on main (86ey9e84m/86ey9e851, 13/7).
      - name: Check for migration timestamp collisions
        run: node scripts/hooks/check-migration-duplicates.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm test

      # pgTAP RLS/trigger tests run against a real local Postgres started by the
      # Supabase CLI (migrations applied from supabase/migrations + seed).
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Full stack (db + auth + rest), not just `db start`: the e2e smoke needs
      # GoTrue for dev-login and PostgREST for the app + DB assertions. Services
      # disabled in supabase/config.toml (analytics, edge runtime…) stay off.
      - name: Start local Supabase stack
        run: supabase start

      # ─────────────────────────────────────────────────────────────────────
      # TEMP PROOF (86eykjgrb round 2) — these four steps and scripts/gate-proof/
      # are DELETED in the next commit. They exist so the review's central
      # question ("can you show the gate goes red where it must?") is answered by
      # CI rather than by argument. Each step asserts its own claim against the
      # real local stack and the real Supabase CLI, so the step's pass/fail IS the
      # verdict — see scripts/gate-proof/run.sh.
      # `if: always()` so one failing proof does not hide the others.
      - name: PROOF A — pg_prove PASSes a drifted file, the gate turns it red
        if: always()
        run: bash scripts/gate-proof/run.sh A

      - name: PROOF B1 — with the fix, "# No tests run!" survives and is named
        if: always()
        run: bash scripts/gate-proof/run.sh B1

      - name: PROOF B2 — without the fix, currval() destroys that signal
        if: always()
        run: bash scripts/gate-proof/run.sh B2

      - name: PROOF D — arguments reach the real CLI (Files=1, not 56)
        if: always()
        run: bash scripts/gate-proof/run.sh D

      # Wrapper, not bare `supabase test db`: pg_prove exits 0 on a file whose
      # plan() and assertion count have drifted apart, because pgTAP reports that
      # only as a TAP comment (86eykjgrb). scripts/db-test.mjs streams the normal
      # output through and turns that comment into a red build.
      - name: Run database tests (pgTAP)
        if: always()
        run: node scripts/db-test.mjs

      # Real cross-connection concurrency test for the quota/capacity/tier-max
      # trigger locking fix (86ey9e8ar) — needs two genuinely separate, racing
      # Postgres transactions, which a single-connection pgTAP file can't give
      # it (see the script's header comment for why dblink wasn't an option
      # against this project's local/CI Supabase image).
      - name: Run quota/capacity trigger concurrency test
        run: pnpm db:test:concurrency

      # STAP 4.3 — core-flow smoke with DB-state assertions (86ey7q6ze). One
      # deliberately small spec; Playwright boots `pnpm dev` itself (PORT=3000).
      - name: Provision .env.local from the running stack
        run: node scripts/dev-env.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke (Playwright)
        run: pnpm e2e:smoke

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders only — the clients read these at request time,
          # so static analysis just needs them present. Real values come from the
          # hosting env (Vercel) for actual deploys.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output
          path: .next/
          if-no-files-found: ignore
