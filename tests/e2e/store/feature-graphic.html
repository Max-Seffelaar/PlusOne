<!doctype html>
<!--
  Google Play feature graphic, 1024×500 (86ey6bf8k). Rendered to PNG by
  feature-graphic.spec.ts — never opened on its own: the spec injects the
  app's own self-hosted fonts and the repo's "+1" icon into the slots below.
  Tokens from design-system.md: --bg #0B0B0D, ONE accent #B5A6FF, --dim text,
  Bricolage Grotesque display + Hanken Grotesk body. No device mockups, no
  claims the product can't back (no ticketing, no invitations — decision #36).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /*FONT_FACES*/
      :root {
        --bg: #0b0b0d;
        --text: #ffffff;
        --dim: rgba(255, 255, 255, 0.58);
        --acc: #b5a6ff;
        --line: rgba(255, 255, 255, 0.1);
        --display: /*DISPLAY_FAMILY*/, 'Bricolage Grotesque', sans-serif;
        --body: /*BODY_FAMILY*/, 'Hanken Grotesk', sans-serif;
      }
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background: var(--bg);
      }
      .stage {
        position: relative;
        box-sizing: border-box;
        width: 1024px;
        height: 500px;
        display: flex;
        align-items: center;
        gap: 52px;
        padding: 0 96px;
      }
      /* One quiet accent wash behind the mark — the only colour on the canvas. */
      .stage::before {
        content: '';
        position: absolute;
        left: -92px;
        top: -30px;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(181, 166, 255, 0.16), rgba(181, 166, 255, 0));
      }
      .icon {
        position: relative;
        flex: none;
        width: 184px;
        height: 184px;
        border-radius: 44px;
        overflow: hidden;
        box-shadow: 0 0 0 1px var(--line);
      }
      .icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .copy {
        position: relative;
        min-width: 0;
      }
      .wordmark {
        margin: 0;
        font-family: var(--display);
        font-weight: 800;
        font-size: 104px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      .line {
        margin: 26px 0 0;
        font-family: var(--body);
        font-weight: 500;
        font-size: 31px;
        line-height: 1.3;
        color: var(--dim);
      }
      .line strong {
        font-weight: 700;
        color: var(--acc);
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="icon"><!--ICON--></div>
      <div class="copy">
        <h1 class="wordmark">PlusOne</h1>
        <p class="line">Guest lists, quotas and the door.<br /><strong>One app.</strong></p>
      </div>
    </main>
  </body>
</html>
