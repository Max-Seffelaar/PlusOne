  <path fill="#16132B" d="M274 541L145 541L145 391L0 391L0 269L145 269L145 120L274 120L274 269L420 269L420 391L274 391L274 541ZM768 660L605 660L605 226L507 226L507 85Q556 85 586 67.5Q616 50 625 0L768 0Z"/>
