<?xml version="1.0" encoding="UTF-8"?>
<!--
  PlusOne "+1" mark: vector master for every app/PWA icon and splash.
  Glyph outlines of "+" and "1" from Bricolage Grotesque ExtraBold (800)
  (@fontsource/bricolage-grotesque 5.3.0, 1000 upm, no kerning pair),
  converted to paths once at design time; no font ships with the app.
  The viewBox is the tight ink bounding box, so "centred" always means
  optically centred on the ink. Ink colour #16132B.
  Regenerate every raster/vector target: node scripts/native-icons.mjs
-->
