# Supabase local development configuration
project_id = "PlusOne_Guestlist"

# NOTE: default Supabase ports (54320–54324) fall inside a Windows excluded port
# range (54258–54357, Hyper-V/WSL reservation) on this machine — moved to 553xx.
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]
# Invite-only (decision #20): no open signup, no anonymous sessions.
enable_signup = false
enable_anonymous_sign_ins = false
# Short-lived access tokens + refresh rotation (spec §5 hardening).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# Passwordless-first: the email provider stays ENABLED (OTP logins), but global
# signup is off via [auth].enable_signup = false (invite-only). Do NOT set
# [auth.email].enable_signup here — in this CLI it toggles the whole email
# provider off. Password auth is disabled in the hosted dashboard
# (see docs/auth-setup.md); local has no password flow in use.
# Secure (double opt-in) e-mail change — only the user changes their own
# address, confirmed from both inboxes (decision #24).
double_confirm_changes = true
enable_confirmations = true
# 6-digit OTP, valid 10 minutes; throttle re-requests (anti-abuse, §5).
otp_length = 6
otp_expiry = 600
max_frequency = "5s"

# Mandatory MFA for admin/finance is enforced in-app + RLS; the factor type is
# TOTP (decision #20). Enrollment/verification must be enabled here.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db]
port = 55322
shadow_port = 55320

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
