# Supabase configuration
# Generated by `supabase init`
# Customize as needed

[project]
account_tier = "free" # free, pro
database_major_version = 15
db_port = 54322
db_pool_mode = "transaction"
db_pool_size = 15

[db.realtime]
enabled = true
max_bytes_per_second = 1048576
max_concurrent_updates = 200
max_retries = 5

[realtime.log_level]
database = "info"
beaver = "info"

[storage]
file_size_limit = 52428800
s3_host = "http://localhost:9000"
s3_region = "us-east-1"
s3_access_key = "minioadmin"
s3_secret_key = "minioadmin"
s3_bucket = "stub"
public_url_base_path = "/storage/v1/s3"

[auth.external.google]
enabled = false

[auth.external.github]
enabled = false

[functions.hello_world]
verify_jwt = false

[analytics]
enabled = false
