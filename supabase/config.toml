# Supabase local development configuration
project_id = "PlusOne_Guestlist"

# NOTE: default Supabase ports (54320–54324) fall inside a Windows excluded port
# range (54258–54357, Hyper-V/WSL reservation) on this machine — moved to 553xx.
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[db]
port = 55322
shadow_port = 55320

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = 52428800

[analytics]
enabled = false
