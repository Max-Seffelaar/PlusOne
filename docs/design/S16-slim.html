<style>\n  :root {\n    --bg:#0B0B0D; --elev:#161618; --elev2:#1E1E21; --line:rgba(255,255,255,0.10); --line2:rgba(255,255,255,0.06);\n    --text:#FFFFFF; --dim:rgba(255,255,255,0.58); --faint:rgba(255,255,255,0.40); --ghost:rgba(255,255,255,0.26);\n    --acc:#B5A6FF; --acc-soft:#C9BEFF; --acc-dim:rgba(181,166,255,0.16); --on-acc:#16132B;\n    --disp:'Bricolage Grotesque', sans-serif; --body:'Hanken Grotesk', system-ui, sans-serif;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body { font-family: var(--body); color: var(--text); -webkit-font-smoothing: antialiased; }\n  a { color: var(--acc); text-decoration: none; } a:hover { color: var(--acc-soft); }\n  .cap { font: 600 12px/1 ui-monospace, \"SF Mono\", Menlo, monospace; letter-spacing: 0.08em; color: #6a6a72; text-transform: uppercase; margin-bottom: 12px; }\n  .pbtn { transition: filter .15s, transform .08s, background .15s, border-color .15s, color .15s; cursor: pointer; } .pbtn:hover { filter: brightness(1.08); } .pbtn:active { transform: scale(0.98); }\n  .bar-fill { transition: width .6s cubic-bezier(.16,1,.3,1); }\n  @keyframes rise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }\n  .rise { animation: rise .5s cubic-bezier(.16,1,.3,1) both; }\n  @keyframes modalIn { from { opacity:0; transform: translateY(10px) scale(.98); } to { opacity:1; transform:none; } }\n  .modal-card { animation: modalIn .22s cubic-bezier(.16,1,.3,1) both; }\n  @media (prefers-reduced-motion: reduce) { .rise, .modal-card { animation: none; } .bar-fill { transition: none; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"root\"><\u002Fdiv>\n\n<script src=\"a37e4118-ba0b-4ae7-ab26-dd12a4f2d1dd\"><\u002Fscript>\n<script src=\"2f768257-5218-41e7-b931-6c6390915a56\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"9c25fd95-fd4c-48b6-86cf-960e99e1df60\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"dfe5f1da-30e4-437a-81a1-2555dda2f6a6\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\u002Fscript>\n\n<script type=\"text/babel\" data-presets=\"react\">\nconst P = {\n  bg:\"#0B0B0D\", elev:\"#161618\", elev2:\"#1E1E21\", line:\"rgba(255,255,255,0.10)\", line2:\"rgba(255,255,255,0.06)\",\n  text:\"#FFFFFF\", dim:\"rgba(255,255,255,0.58)\", faint:\"rgba(255,255,255,0.40)\", ghost:\"rgba(255,255,255,0.26)\",\n  acc:\"#B5A6FF\", accSoft:\"#C9BEFF\", accDim:\"rgba(181,166,255,0.16)\", onAcc:\"#16132B\",\n  disp:\"'Bricolage Grotesque', sans-serif\", body:\"'Hanken Grotesk', system-ui, sans-serif\",\n};\nconst fmt = (n) => n.toLocaleString('en-US');\nconst STEPS = [\"Views\",\"Requests\",\"Approved\",\"In\"];\nconst PATHS = {\n  x:\"M6 6l12 12M18 6L6 18\", copy:\"M9 9h10v10H9zM5 15V5h10\", check:\"M5 12l5 5 9-11\",\n  qr:\"M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z\",\n  dl:\"M12 4v11M7 11l5 5 5-5M5 20h14\", search:\"M11 11m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4\",\n};\nfunction I({ d, size=20, sw=1.9, c=\"currentColor\" }) {\n  return <svg width={size} height={size} viewBox=\"0 0 24 24\" fill=\"none\" stroke={c} strokeWidth={sw} strokeLinecap=\"round\" strokeLinejoin=\"round\" style={{ display:\"block\", flexShrink:0 }}><path d={PATHS[d]} /><\u002Fsvg>;\n}\n\n// ---------- QR ----------\nfunction makeQrCanvas(text, target=440) {\n  const qr = qrcode(0, \"M\"); qr.addData(text); qr.make();\n  const n = qr.getModuleCount(), margin = 4, total = n + margin*2;\n  const scale = Math.max(4, Math.floor(target/total)), px = total*scale;\n  const c = document.createElement(\"canvas\"); c.width = px; c.height = px;\n  const g = c.getContext(\"2d\");\n  g.fillStyle = \"#FFFFFF\"; g.fillRect(0,0,px,px);\n  g.fillStyle = \"#0B0B0D\";\n  for (let r=0;r<n;r++) for (let col=0;col<n;col++) if (qr.isDark(r,col)) g.fillRect((col+margin)*scale,(r+margin)*scale,scale,scale);\n  return c;\n}\n\n// ---------- MINI FUNNEL ----------\nfunction MiniFunnel({ f, muted }) {\n  const max = Math.max(1, f[0]);\n  return <div style={{ display:\"flex\", flexDirection:\"column\", gap:9, opacity: muted?0.85:1 }}>\n    {STEPS.map((s,i) => { const last = i===3; const w = Math.max(2, (f[i]/max)*100); return <div key={s} style={{ display:\"flex\", alignItems:\"center\", gap:11 }}>\n      <div style={{ width:64, flexShrink:0, fontSize:12.5, fontWeight:600, color: last?P.text:P.dim, fontFamily:P.body }}>{s}<\u002Fdiv>\n      <div style={{ flex:1, height:22, borderRadius:7, background:P.elev2, overflow:\"hidden\" }}>\n        <div className=\"bar-fill\" style={{ width:w+\"%\", height:\"100%\", borderRadius:7, background: last?P.acc:\"rgba(255,255,255,0.16)\" }} />\n      <\u002Fdiv>\n      <div style={{ width:44, flexShrink:0, textAlign:\"right\", fontFamily:P.disp, fontWeight:800, fontSize:15, color: last?P.acc:P.text, fontVariantNumeric:\"tabular-nums\" }}>{fmt(f[i])}<\u002Fdiv>\n    <\u002Fdiv>; })}\n  <\u002Fdiv>;\n}\n\n// ---------- QR MODAL ----------\nfunction QrModal({ ev, onClose }) {\n  const ref = React.useRef(null);\n  const [copied, setCopied] = React.useState(false);\n  React.useEffect(() => {\n    if (!ref.current) return;\n    ref.current.innerHTML = \"\";\n    try { const c = makeQrCanvas(ev.url); c.style.width = \"220px\"; c.style.height = \"220px\"; c.style.display = \"block\"; c.style.imageRendering = \"pixelated\"; ref.current.appendChild(c); }\n    catch (e) { ref.current.textContent = \"QR unavailable\"; }\n  }, [ev.url]);\n  const download = () => {\n    try { const c = makeQrCanvas(ev.url, 900); const a = document.createElement(\"a\"); a.href = c.toDataURL(\"image/png\"); a.download = \"plusone-\" + ev.slug + \"-qr.png\"; a.click(); } catch (e) {}\n  };\n  const copy = () => { setCopied(true); try { navigator.clipboard.writeText(ev.url); } catch (e) {} };\n  return <div onClick={onClose} style={{ position:\"absolute\", inset:0, zIndex:60, background:\"rgba(6,6,8,0.68)\", backdropFilter:\"blur(3px)\", display:\"flex\", alignItems:\"center\", justifyContent:\"center\", padding:20 }}>\n    <div className=\"modal-card\" onClick={(e) => e.stopPropagation()} style={{ width:\"100%\", maxWidth:320, background:P.elev, border:\"1px solid \"+P.line, borderRadius:22, padding:22, boxShadow:\"0 30px 90px rgba(0,0,0,0.6)\", display:\"flex\", flexDirection:\"column\", alignItems:\"center\", gap:16 }}>\n      <div style={{ display:\"flex\", alignItems:\"flex-start\", justifyContent:\"space-between\", width:\"100%\", gap:10 }}>\n        <div>\n          <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:18, letterSpacing:\"-0.01em\" }}>{ev.name}<\u002Fdiv>\n          <div style={{ fontSize:12.5, color:P.faint, marginTop:2 }}>Point a phone camera here to open your link.<\u002Fdiv>\n        <\u002Fdiv>\n        <button className=\"pbtn\" onClick={onClose} style={{ width:32, height:32, borderRadius:10, border:\"1px solid \"+P.line, background:\"transparent\", color:P.faint, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", flexShrink:0 }}><I d=\"x\" size={16} /><\u002Fbutton>\n      <\u002Fdiv>\n      <div ref={ref} style={{ background:\"#FFFFFF\", padding:14, borderRadius:16, lineHeight:0 }} />\n      <div style={{ width:\"100%\", background:P.bg, border:\"1px solid \"+P.line, borderRadius:12, padding:\"10px 12px\", fontSize:12.5, color:P.dim, fontFamily:P.body, textAlign:\"center\", whiteSpace:\"nowrap\", overflow:\"hidden\", textOverflow:\"ellipsis\" }}>{ev.url}<\u002Fdiv>\n      <div style={{ display:\"flex\", gap:10, width:\"100%\" }}>\n        <button className=\"pbtn\" onClick={copy} style={{ flex:1, justifyContent:\"center\", display:\"inline-flex\", alignItems:\"center\", gap:7, padding:\"12px 0\", borderRadius:13, background: copied?P.accDim:\"transparent\", color: copied?P.acc:P.text, border:\"1px solid \"+(copied?\"transparent\":P.line), fontFamily:P.disp, fontWeight:700, fontSize:14 }}><I d={copied?\"check\":\"copy\"} size={15} c={copied?P.acc:P.text} sw={2.2} />{copied?\"Copied\":\"Copy link\"}<\u002Fbutton>\n        <button className=\"pbtn\" onClick={download} style={{ flex:1, justifyContent:\"center\", display:\"inline-flex\", alignItems:\"center\", gap:7, padding:\"12px 0\", borderRadius:13, background:P.acc, color:P.onAcc, border:\"none\", fontFamily:P.disp, fontWeight:700, fontSize:14 }}><I d=\"dl\" size={16} c={P.onAcc} sw={2.2} />Download<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>;\n}\n\n// ---------- EVENT CARD ----------\nfunction EventCard({ ev, onQr }) {\n  const past = ev.when === \"past\";\n  const [copied, setCopied] = React.useState(false);\n  const copy = () => { setCopied(true); try { navigator.clipboard.writeText(ev.url); } catch (e) {} };\n  const started = ev.f[0] > 0;\n  return <div style={{ background:P.elev, border:\"1px solid \"+P.line, borderRadius:20, padding: past?\"18px 20px 20px\":\"18px 20px 18px\", opacity: past?0.92:1 }}>\n    <div style={{ display:\"flex\", alignItems:\"center\", justifyContent:\"space-between\", gap:10, marginBottom:16 }}>\n      <div>\n        <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:17, letterSpacing:\"-0.01em\" }}>{ev.name}<\u002Fdiv>\n        <div style={{ fontSize:12.5, color:P.faint, marginTop:2 }}>{ev.date}<\u002Fdiv>\n      <\u002Fdiv>\n      <span style={{ fontSize:10.5, fontWeight:800, letterSpacing:\"0.05em\", textTransform:\"uppercase\", padding:\"5px 9px\", borderRadius:8, whiteSpace:\"nowrap\",\n        color: past?P.faint:P.acc, background: past?\"transparent\":P.accDim, border:\"1px solid \"+(past?P.line:\"transparent\") }}>{past?\"Past\":\"Upcoming\"}<\u002Fspan>\n    <\u002Fdiv>\n    {started\n      ? <MiniFunnel f={ev.f} muted={past} />\n      : <div style={{ display:\"flex\", alignItems:\"center\", gap:9, padding:\"14px 14px\", borderRadius:13, background:P.elev2, border:\"1px dashed \"+P.line, fontSize:13, color:P.dim }}>\n          <span style={{ width:7, height:7, borderRadius:99, background:P.acc, flexShrink:0 }} />Not live yet — share to get this rolling.\n        <\u002Fdiv>}\n    {!past && <div style={{ display:\"flex\", gap:10, marginTop:16 }}>\n      <button className=\"pbtn\" onClick={copy} style={{ flex:1, justifyContent:\"center\", display:\"inline-flex\", alignItems:\"center\", gap:7, padding:\"11px 0\", borderRadius:12, background: copied?P.accDim:P.elev2, color: copied?P.acc:P.text, border:\"1px solid \"+(copied?\"transparent\":P.line), fontFamily:P.disp, fontWeight:700, fontSize:13.5 }}><I d={copied?\"check\":\"copy\"} size={15} c={copied?P.acc:P.text} sw={2.2} />{copied?\"Copied\":\"Copy link\"}<\u002Fbutton>\n      <button className=\"pbtn\" onClick={() => onQr(ev)} style={{ flex:1, justifyContent:\"center\", display:\"inline-flex\", alignItems:\"center\", gap:7, padding:\"11px 0\", borderRadius:12, background:P.elev2, color:P.text, border:\"1px solid \"+P.line, fontFamily:P.disp, fontWeight:700, fontSize:13.5 }}><I d=\"qr\" size={15} c={P.acc} sw={1.6} />QR code<\u002Fbutton>\n    <\u002Fdiv>}\n  <\u002Fdiv>;\n}\n\n// ---------- DATA ----------\nconst EVENTS = [\n  { name:\"FRENZY\", date:\"Sat 12 Jul · Club Vesper\", when:\"upcoming\", slug:\"frenzy\", url:\"req.plusone.app/vesper/frenzy?ref=jayden\", f:[196,44,38,33] },\n  { name:\"Neon Hours\", date:\"Sat 19 Jul · Club Vesper\", when:\"upcoming\", slug:\"neon-hours\", url:\"req.plusone.app/vesper/neon-hours?ref=jayden\", f:[0,0,0,0] },\n  { name:\"Rooftop Sundown\", date:\"Sun 27 Jul · Club Vesper\", when:\"upcoming\", slug:\"rooftop-sundown\", url:\"req.plusone.app/vesper/rooftop-sundown?ref=jayden\", f:[41,7,5,4] },\n  { name:\"August Opening\", date:\"Sat 2 Aug · Club Vesper\", when:\"upcoming\", slug:\"august-opening\", url:\"req.plusone.app/vesper/august-opening?ref=jayden\", f:[0,0,0,0] },\n  { name:\"Warehouse XL\", date:\"Sat 9 Aug · Club Vesper\", when:\"upcoming\", slug:\"warehouse-xl\", url:\"req.plusone.app/vesper/warehouse-xl?ref=jayden\", f:[0,0,0,0] },\n  { name:\"Afterglow\", date:\"Fri 4 Jul · Club Vesper\", when:\"past\", slug:\"afterglow\", url:\"req.plusone.app/vesper/afterglow?ref=jayden\", f:[142,31,26,22] },\n  { name:\"Pulse × Lofi\", date:\"Sat 21 Jun · Club Vesper\", when:\"past\", slug:\"pulse-lofi\", url:\"req.plusone.app/vesper/pulse-lofi?ref=jayden\", f:[74,14,10,9] },\n  { name:\"Midsummer\", date:\"Sat 14 Jun · Club Vesper\", when:\"past\", slug:\"midsummer\", url:\"req.plusone.app/vesper/midsummer?ref=jayden\", f:[168,37,31,27] },\n  { name:\"Velvet Room\", date:\"Fri 6 Jun · Club Vesper\", when:\"past\", slug:\"velvet-room\", url:\"req.plusone.app/vesper/velvet-room?ref=jayden\", f:[96,21,18,15] },\n  { name:\"Spring Closer\", date:\"Sat 24 May · Club Vesper\", when:\"past\", slug:\"spring-closer\", url:\"req.plusone.app/vesper/spring-closer?ref=jayden\", f:[203,46,39,34] },\n  { name:\"Basement Tapes\", date:\"Fri 16 May · Club Vesper\", when:\"past\", slug:\"basement-tapes\", url:\"req.plusone.app/vesper/basement-tapes?ref=jayden\", f:[58,12,10,8] },\n  { name:\"Neon Nights\", date:\"Sat 3 May · Club Vesper\", when:\"past\", slug:\"neon-nights\", url:\"req.plusone.app/vesper/neon-nights?ref=jayden\", f:[121,27,23,19] },\n];\nconst PAGE = 4;\n\n// ---------- CHROME ----------\nfunction Header() {\n  return <div style={{ padding:\"6px 2px 2px\" }}>\n    <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:30, letterSpacing:\"-0.02em\", lineHeight:1.05 }}>Hey Jayden 👋<\u002Fdiv>\n    <div style={{ fontSize:14.5, color:P.dim, marginTop:6 }}>Your numbers at Club Vesper.<\u002Fdiv>\n  <\u002Fdiv>;\n}\nfunction Totals({ f, zero }) {\n  const cells = [[\"Views\",f[0]],[\"Requests\",f[1]],[\"Approved\",f[2]],[\"Through the door\",f[3]]];\n  if (zero) return <div style={{ background:\"linear-gradient(180deg, rgba(181,166,255,0.09), \"+P.elev+\" 70%)\", border:\"1px solid \"+P.line, borderRadius:24, padding:\"34px 24px\", textAlign:\"center\", display:\"flex\", flexDirection:\"column\", alignItems:\"center\", gap:14 }}>\n    <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:78, lineHeight:0.9, letterSpacing:\"-0.03em\", color:P.acc }}>0<\u002Fdiv>\n    <div>\n      <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:21, letterSpacing:\"-0.01em\" }}>Share your link<\u002Fdiv>\n      <div style={{ fontSize:14, color:P.dim, marginTop:6, lineHeight:1.5, maxWidth:250 }}>This fills up tonight. Every tap, request and check-in lands right here.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>;\n  return <div style={{ background:\"linear-gradient(180deg, rgba(181,166,255,0.10), \"+P.elev+\" 68%)\", border:\"1px solid \"+P.line, borderRadius:24, padding:\"24px 22px\" }}>\n    <div style={{ display:\"grid\", gridTemplateColumns:\"1fr 1fr\", gap:\"22px 16px\" }}>\n      {cells.map(([l,v],i) => { const hero = i===3; return <div key={l} style={ hero ? { gridColumn:\"1 / -1\", marginTop:6, paddingTop:20, borderTop:\"1px solid \"+P.line2 } : {} }>\n        <div style={{ fontFamily:P.disp, fontWeight:800, lineHeight:0.92, letterSpacing:\"-0.03em\", fontVariantNumeric:\"tabular-nums\", fontSize: hero?76:40, color: hero?P.acc:P.text }}>{fmt(v)}<\u002Fdiv>\n        <div style={{ fontSize: hero?15:13, color: hero?P.dim:P.faint, marginTop: hero?8:5, fontWeight: hero?600:500 }}>{l}<\u002Fdiv>\n      <\u002Fdiv>; })}\n    <\u002Fdiv>\n  <\u002Fdiv>;\n}\nfunction GroupLabel({ children, count }) {\n  return <div style={{ display:\"flex\", alignItems:\"baseline\", gap:8, padding:\"6px 2px 0\" }}>\n    <span style={{ fontSize:11.5, fontWeight:700, letterSpacing:\"0.07em\", color:P.faint, textTransform:\"uppercase\" }}>{children}<\u002Fspan>\n    {count != null && <span style={{ fontSize:11.5, fontWeight:700, color:P.ghost, fontFamily:P.disp, fontVariantNumeric:\"tabular-nums\" }}>{count}<\u002Fspan>}\n  <\u002Fdiv>;\n}\n\n// ---------- SEARCH ----------\nfunction Search({ q, setQ }) {\n  return <div style={{ display:\"flex\", alignItems:\"center\", gap:10, background:P.elev, border:\"1px solid \"+P.line, borderRadius:14, padding:\"0 12px\", height:46 }}>\n    <I d=\"search\" size={17} c={P.faint} sw={1.9} />\n    <input value={q} onChange={(e) => setQ(e.target.value)} placeholder=\"Search events\" style={{ flex:1, background:\"transparent\", border:\"none\", outline:\"none\", color:P.text, fontSize:14.5, fontFamily:P.body }} />\n    {q && <button className=\"pbtn\" onClick={() => setQ(\"\")} style={{ width:26, height:26, borderRadius:8, border:\"none\", background:P.elev2, color:P.faint, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", flexShrink:0 }}><I d=\"x\" size={13} /><\u002Fbutton>}\n  <\u002Fdiv>;\n}\n\n// ---------- EVENTS GROUP (paginated) ----------\nfunction EventsGroup({ label, items, onQr }) {\n  const [shown, setShown] = React.useState(PAGE);\n  const vis = items.slice(0, shown);\n  const rest = items.length - shown;\n  if (items.length === 0) return null;\n  return <React.Fragment>\n    <GroupLabel count={items.length}>{label}<\u002FGroupLabel>\n    {vis.map((ev,i) => <div key={ev.slug} className=\"rise\" style={{ animationDelay:(0.04*(i% PAGE +1))+\"s\" }}><EventCard ev={ev} onQr={onQr} /><\u002Fdiv>)}\n    {rest > 0 && <button className=\"pbtn\" onClick={() => setShown(shown+PAGE)} style={{ padding:\"12px 0\", borderRadius:13, background:\"transparent\", border:\"1px solid \"+P.line, color:P.text, fontFamily:P.disp, fontWeight:700, fontSize:14 }}>Show {Math.min(PAGE, rest)} more · {rest} left<\u002Fbutton>}\n  <\u002FReact.Fragment>;\n}\nfunction Footer() {\n  return <div style={{ display:\"flex\", flexDirection:\"column\", alignItems:\"center\", gap:14, paddingTop:8 }}>\n    <div style={{ fontSize:12.5, color:P.faint, display:\"flex\", alignItems:\"center\", gap:7, textAlign:\"center\" }}>\n      <span style={{ width:6, height:6, borderRadius:99, background:P.acc, flexShrink:0 }} />Live numbers. Only you can see this link.\n    <\u002Fdiv>\n    <div style={{ display:\"inline-flex\", alignItems:\"center\", gap:9, padding:\"9px 13px\", borderRadius:12, border:\"1px solid \"+P.line, background:P.elev }}>\n      <span style={{ width:24, height:24, borderRadius:8, background:P.acc, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", fontFamily:P.disp, fontWeight:800, fontSize:12, color:P.onAcc, letterSpacing:\"-0.03em\" }}>+1<\u002Fspan>\n      <span style={{ fontSize:12.5, color:P.dim, fontWeight:500 }}>Guest list, handled by PlusOne<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>;\n}\n\n// ---------- PAGE ----------\nfunction Page({ zero }) {\n  const [qr, setQr] = React.useState(null);\n  const [q, setQ] = React.useState(\"\");\n  const norm = q.trim().toLowerCase();\n  const match = (e) => !norm || (e.name+\" \"+e.date).toLowerCase().includes(norm);\n  const upcoming = EVENTS.filter((e) => e.when === \"upcoming\").map((e) => zero ? { ...e, f:[0,0,0,0] } : e).filter(match);\n  const past = (zero ? [] : EVENTS.filter((e) => e.when === \"past\")).filter(match);\n  const none = norm && upcoming.length === 0 && past.length === 0;\n  return <div style={{ width:390, minHeight:760, background:P.bg, borderRadius:20, border:\"1px solid \"+P.line, overflow:\"hidden\", position:\"relative\" }}>\n    <div style={{ position:\"absolute\", top:0, left:0, right:0, height:340, background:\"radial-gradient(120% 90% at 50% -18%, #211d3a 0%, rgba(33,29,58,0.35) 42%, rgba(11,11,13,0) 72%)\", pointerEvents:\"none\" }} />\n    <div style={{ position:\"relative\", padding:\"26px 18px 26px\", display:\"flex\", flexDirection:\"column\", gap:16 }}>\n      <Header />\n      <div className=\"rise\"><Totals f={zero?[0,0,0,0]:[412,89,71,64]} zero={zero} /><\u002Fdiv>\n\n      <div style={{ paddingTop:2 }}><Search q={q} setQ={setQ} /><\u002Fdiv>\n\n      {none\n        ? <div style={{ textAlign:\"center\", padding:\"30px 20px\", color:P.faint, fontSize:14 }}>No events match “{q}”.<\u002Fdiv>\n        : <React.Fragment>\n            <EventsGroup key={\"up\"+norm} label={zero ? \"Your events\" : \"Upcoming\"} items={upcoming} onQr={setQr} />\n            <EventsGroup key={\"past\"+norm} label=\"Past\" items={past} onQr={setQr} />\n          <\u002FReact.Fragment>}\n\n      <Footer />\n    <\u002Fdiv>\n    {qr && <QrModal ev={qr} onClose={() => setQr(null)} />}\n  <\u002Fdiv>;\n}\nfunction Frame({ x, cap, children }) {\n  return <div style={{ position:\"absolute\", left:x, top:60 }}><div className=\"cap\">{cap}<\u002Fdiv>{children}<\u002Fdiv>;\n}\nReactDOM.createRoot(document.getElementById(\"root\")).render(<React.Fragment>\n  <Frame x={0} cap=\"Public stats · 390 — populated\"><Page /><\u002FFrame>\n  <Frame x={470} cap=\"Public stats · 390 — zero state\"><Page zero /><\u002FFrame>\n<\u002FReact.Fragment>);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
