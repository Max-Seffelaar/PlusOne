:P.faint }}><I d=\"link\" size={size*0.42} /><\u002Fdiv>;\n}\nconst Card = ({ children, style }) => <div style={{ background:P.elev, border:\"1px solid \"+P.line, borderRadius:18, ...style }}>{children}<\u002Fdiv>;\nconst Lbl = ({ children, style }) => <div style={{ fontSize:11.5, fontWeight:700, letterSpacing:\"0.07em\", color:P.faint, fontFamily:P.body, textTransform:\"uppercase\", ...style }}>{children}<\u002Fdiv>;\nfunction MiniChip({ children, accent, dashed, style }) {\n  return <span style={{ display:\"inline-flex\", alignItems:\"center\", gap:4, fontSize:10.5, fontWeight:800, letterSpacing:\"0.04em\", padding:\"3px 7px\", borderRadius:7, fontFamily:P.body, textTransform:\"uppercase\",\n    color: accent ? P.acc : P.dim, background: accent ? P.accDim : \"transparent\", border:\"1px \"+(dashed?\"dashed\":\"solid\")+\" \"+(accent?\"transparent\":P.line), whiteSpace:\"nowrap\", ...style }}>{children}<\u002Fspan>;\n}\n\n// ---------- DATA ----------\nconst RANGES = [\"30 days\",\"90 days\",\"All time\"];\nconst INF = {\n  \"30 days\": [\n    { name:\"Deniz Kaya\", links:3, events:3, f:[512,96,78,64] },\n    { name:\"Mila Fontaine\", links:3, events:2, f:[412,89,71,58] },\n    { name:\"Rico Mendes\", links:2, events:2, f:[388,77,66,52] },\n    { name:\"Sanne Bakker\", links:2, events:1, f:[274,61,54,47] },\n    { name:\"Jayden Cole\", links:1, events:1, f:[196,44,38,33] },\n    { name:\"Lotte Vermeer\", links:1, events:1, f:[142,29,24,19] },\n    { name:\"Noah Prins\", links:1, events:1, f:[128,26,22,17] },\n    { name:\"Yara El Amrani\", links:1, events:1, f:[117,23,20,16] },\n    { name:\"Tycho de Groot\", links:1, events:1, f:[104,21,18,14] },\n    { name:\"Isa Willems\", links:1, events:1, f:[92,18,15,12] },\n    { name:\"Bram Jansen\", links:1, events:1, f:[78,15,13,10] },\n    { name:\"Féline Dubois\", links:1, events:1, f:[64,12,10,8] },\n  ],\n  \"90 days\": [\n    { name:\"Deniz Kaya\", links:6, events:7, f:[1480,286,231,198] },\n    { name:\"Mila Fontain 2,101,92,80] }, { name:\"WhatsApp broadcast\", f:[288,52,46,38] }, { name:\"Spotify link in bio\", f:[261,38,35,29] }, { name:\"Facebook event\", f:[184,31,27,22] }, { name:\"Poster QR code\", f:[156,24,21,17] }, { name:\"Newsletter\", f:[121,18,15,12] } ],\n  \"All time\":[ { name:\"Instagram bio\", f:[1840,304,278,241] }, { name:\"WhatsApp broadcast\", f:[860,156,138,116] }, { name:\"Spotify link in bio\", f:[712,109,99,84] }, { name:\"Facebook event\", f:[544,92,81,66] }, { name:\"Poster QR code\", f:[441,70,61,49] }, { name:\"Newsletter\", f:[352,54,46,37] } ],\n};\nconst EVENTS = [\"FRENZY · Sat 12 Jul\",\"AFTERGLOW · Fri 4 Jul\",\"PULSE × LOFI · Sat 21 Jun\"];\nconst FUNNEL = {\n  \"FRENZY · Sat 12 Jul\": [\n    { name:\"Deniz Kaya\", label:false, auto:true, f:[512,96,78,64] },\n    { name:\"Mila Fontaine\", label:false, cap:25, f:[288,63,25,25] },\n    { name:\"Rico Mendes\", label:false, auto:true, f:[241,52,44,38] },\n    { name:\"Instagram bio\", label:true, f:[208,33,30,26] },\n    { name:\"Noah Prins\", label:false, f:[176,38,32,27] },\n    { name:\"Sanne Bakker\", label:false, auto:true, f:[152,33,28,24] },\n    { name:\"WhatsApp broadcast\", label:true, f:[94,17,15,12] },\n  ],\n  \"AFTERGLOW · Fri 4 Jul\": [\n    { name:\"Deniz Kaya\", label:false, auto:true, f:[468,88,72,61] },\n    { name:\"Sanne Bakker\", label:false, f:[274,61,54,47] },\n    { name:\"Instagram bio\", label:true, f:[188,29,27,23] },\n  ],\n  \"PULSE × LOFI · Sat 21 Jun\": [\n    { name:\"Mila Fontaine\", label:false, f:[356,74,62,55] },\n    { name:\"Jayden Cole\", label:false, auto:true, f:[196,44,38,33] },\n    { name:\"Lotte Vermeer\", label:false, cap:20, f:[164,38,20,20] },\n    { name:\"Instagram bio\", label:true, f:[166,26,24,20] },\n  ],\n};\nconst STEPS = [\"Views\",\"Requests\",\"Approved\",\"Checked in\"];\nconst TIERS = {\n  \"FRENZY · Sat 12 Jul\": [\"Guestlist\",\"Early entry\",\"VIP table\"],\n  \"AFTERGLOW · Fri 4 Jul\": [\"Guestlist\",\"Regular\",\"VIP\"],\n  \"PULSE × LOFI · Sat 21 Jun\": [\"Guestlist\",\"Regular\",\"Backstage\"],\n  _default: [\"Guestlist\",\"Regular\",\"VIP\"],\n};\n\n// ---------- FUNNEL LINE (shared everywhere) ----------\nfunction FunnelLine({ f, indent=0 }) {\n  const parts = [[f[0],\"views\"],[f[1],\"requests\"],[f[2],\"approved\"],[f[3],\"in\"]];\n  return <div style={{ marginLeft:indent, fontSize:12.5, color:P.faint, fontFamily:P.body, display:\"flex\", flexWrap:\"wrap\", alignItems:\"center\", gap:6 }}>\n    {parts.map((p,i) => <React.Fragment key={i}>\n      <span><b style={{ color:i===3?P.acc:P.dim, fontWeight:700, fontVariantNumeric:\"tabular-nums\" }}>{fmt(p[0])}<\u002Fb> {p[1]}<\u002Fspan>\n      {i<3 && <span style={{ color:P.ghost }}>&rarr;<\u002Fspan>}\n    <\u002FReact.Fragment>)}\n  <\u002Fdiv>;\n}\n\n// ---------- PERFORMANCE ROW (leaderboard + no-influencer + per-event) ----------\nfunction PerfRow({ rank, name, sub, f, chips, isLabel }) {\n  return <div className=\"prow\" style={{ padding:\"15px 22px\", borderBottom:\"1px solid \"+P.line2 }}>\n    <div style={{ display:\"flex\", alignItems:\"center\", gap:14 }}>\n      {rank != null && <div style={{ width:20, textAlign:\"center\", flexShrink:0, fontFamily:P.disp, fontWeight:800, fontSize:17, color:P.ghost, fontVariantNumeric:\"tabular-nums\" }}>{rank}<\u002Fdiv>}\n      {isLabel ? <LinkAvatar size={42} /> : <Avatar name={name} size={42} />}\n      <div style={{ flex:1, minWidth:0 }}>\n        <div style={{ display:\"flex\", alignItems:\"center\", gap:8, minWidth:0 }}>\n          <span style={{ fontFamily:P.disp, fontWeight:700, fontSize:16, letterSpacing:\"-0.01em\", whiteSpace:\"nowrap\", overflow:\"hidden\", textOverflow:\"ellipsis\" }}>{name}<\u002Fspan>\n          {chips}\n        <\u002Fdiv>\n        <div style={{ fontSize:12.5, color:P.faint, marginTop:2 }}>{sub}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style={{ textAlign:\"right\", flexShrink:0 }}>\n        <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:30, lineHeight:1, letterSpacing:\"-0.02em\", color:isLabel?P.text:P.acc, fontVariantNumeric:\"tabular-nums\" }}>{fmt(f[3])}<\u002Fdiv>\n        <div style={{ fontSize:10.5, color:P.faint, marginTop:3, letterSpacing:\"0.04em\" }}>checked in<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style={{ marginTop:11, paddingLeft: rank!=null ? 76 : 56 }}><FunnelLine f={f} /><\u002Fdiv>\n  <\u002Fdiv>;\n}\n\n// ---------- SECTION HEADER ----------\nfunction SectionHead({ kicker, title, sub, right }) {\n  return <div style={{ display:\"flex\", alignItems:\"flex-end\", justifyContent:\"space-between\", gap:16, flexWrap:\"wrap\", marginBottom:14 }}>\n    <div>\n      {kicker && <Lbl style={{ marginBottom:7 }}>{kicker}<\u002FLbl>}\n      <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:22, letterSpacing:\"-0.02em\" }}>{title}<\u002Fdiv>\n      {sub && <div style={{ fontSize:13, color:P.faint, marginTop:3 }}>{sub}<\u002Fdiv>}\n    <\u002Fdiv>\n    {right}\n  <\u002Fdiv>;\n}\n\n// ---------- PAGINATION ----------\nfunction Paginated({ items, pageSize, unit, render }) {\n  const [page, setPage] = React.useState(0);\n  const pages = Math.max(1, Math.ceil(items.length / pageSize));\n  const p = Math.min(page, pages-1);\n  const start = p*pageSize;\n  const slice = items.slice(start, start+pageSize);\n  const pbtn = (dis) => ({ width:32, height:32, borderRadius:9, border:\"1px solid \"+P.line, background:P.elev2, color: dis?P.ghost:P.text, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", opacity: dis?0.45:1, pointerEvents: dis?\"none\":\"auto\" });\n  return <Card style={{ padding:0, overflow:\"hidden\" }}>\n    {slice.map((it,i) => render(it, start+i))}\n    {pages > 1 && <div style={{ display:\"flex\", alignItems:\"center\", justifyContent:\"space-between\", gap:12, padding:\"12px 22px\", borderTop:\"1px solid \"+P.line, background:P.bg }}>\n      <span style={{ fontSize:12.5, color:P.faint, fontFamily:P.body }}>Showing <b style={{ color:P.dim, fontWeight:700, fontVariantNumeric:\"tabular-nums\" }}>{start+1}–{Math.min(start+pageSize, items.length)}<\u002Fb> of {items.length} {unit}<\u002Fspan>\n      <div style={{ display:\"flex\", alignItems:\"center\", gap:8 }}>\n        <button className=\"pbtn\" onClick={() => setPage(p-1)} style={pbtn(p===0)}><I d=\"chevL\" size={16} /><\u002Fbutton>\n        <span style={{ fontSize:12.5, color:P.dim, fontFamily:P.disp, fontWeight:700, fontVariantNumeric:\"tabular-nums\", minWidth:42, textAlign:\"center\" }}>{p+1} / {pages}<\u002Fspan>\n        <button className=\"pbtn\" onClick={() => setPage(p+1)} style={pbtn(p===pages-1)}><I d=\"chev\" size={16} /><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>}\n  <\u002FCard>;\n}\n\n// ---------- EVENT PICKER ----------\nfunction EventPicker({ event, setEvent, open, setOpen }) {\n  return <div style={{ position:\"relative\" }}>\n    <button className=\"pbtn\" onClick={() => setOpen(!open)} style={{ display:\"inline-flex\", alignItems:\"center\", gap:10, padding:\"11px 15px\", borderRadius:13, background:P.elev2, border:\"1px solid \"+P.line, color:P.text, fontFamily:P.disp, fontWeight:700, fontSize:14.5, whiteSpace:\"nowrap\" }}>\n      <I d=\"cal\" size={16} c={P.acc} />{event}<I d=\"chevD\" size={16} c={P.ghost} />\n    <\u002Fbutton>\n    {open && <div style={{ position:\"absolute\", top:\"calc(100% + 6px)\", left:0, zIndex:20, minWidth:250, background:P.elev, border:\"1px solid \"+P.line, borderRadius:14, padding:6, boxShadow:\"0 18px 44px rgba(0,0,0,0.55)\" }}>\n      {EVENTS.map((e) => { const on = e === event; return <button key={e} className=\"pbtn\" onClick={() => { setEvent(e); setOpen(false); }} style={{ display:\"flex\", alignItems:\"center\", gap:9, width:\"100%\", padding:\"11px 12px\", borderRadius:9, border:\"none\", background: on?P.accDim:\"transparent\", color: on?P.acc:P.dim, fontFamily:P.body, fontWeight:600, fontSize:13.5, textAlign:\"left\" }}><span style={{ width:7, height:7, borderRadius:99, background: on?P.acc:P.ghost }} />{e}<\u002Fbutton>; })}\n    <\u002Fdiv>}\n  <\u002Fdiv>;\n}\n\n// ---------- OVERVIEW ----------\nfunction Overview({ event, setEvent, open, setOpen, w=1080 }) {\n  const links = FUNNEL[event] || [];\n  const tot = links.reduce((a,l) => [a[0]+l.f[0], a[1]+l.f[1], a[2]+l.f[2], a[3]+l.f[3]], [0,0,0,0]);\n  const conv = [\n    { l:\"requested\", v: tot[0] ? Math.round(tot[1]/tot[0]*100) : 0 },\n    { l:\"approved\", v: tot[1] ? Math.round(tot[2]/tot[1]*100) : 0 },\n    { l:\"showed up\", v: tot[2] ? Math.round(tot[3]/tot[2]*100) : 0 },\n  ];\n  return <Card style={{ padding:\"22px 24px\", background:\"radial-gradient(140% 200% at 100% 0%, rgba(181,166,255,0.10), \"+P.elev+\" 62%)\" }}>\n    <div style={{ display:\"flex\", alignItems:\"center\", justifyContent:\"space-between\", gap:14, flexWrap:\"wrap\", marginBottom:20 }}>\n      <div>\n        <Lbl style={{ marginBottom:7 }}>Overview<\u002FLbl>\n        <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:22, letterSpacing:\"-0.02em\" }}>How your links are pulling<\u002Fdiv>\n      <\u002Fdiv>\n      <EventPicker event={event} setEvent={setEvent} open={open} setOpen={setOpen} />\n    <\u002Fdiv>\n    <div style={{ display:\"grid\", gridTemplateColumns:\"repeat(\"+(w<500?2:4)+\",minmax(0,1fr))\", gap:10 }}>\n      {STEPS.map((s,i) => <div key={s} style={{ padding:\"14px 16px\", borderRadius:14, background: i===3?P.accDim:P.elev2, border:\"1px solid \"+(i===3?\"transparent\":P.line) }}>\n        <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:30, lineHeight:1, letterSpacing:\"-0.02em\", color: i===3?P.acc:P.text, fontVariantNumeric:\"tabular-nums\" }}>{fmt(tot[i])}<\u002Fdiv>\n        <div style={{ fontSize:12.5, color: i===3?P.dim:P.faint, marginTop:7 }}>{s}<\u002Fdiv>\n      <\u002Fdiv>)}\n    <\u002Fdiv>\n    <div style={{ display:\"flex\", alignItems:\"center\", gap:8, marginTop:16, fontSize:12.5, color:P.faint, fontFamily:P.body, flexWrap:\"wrap\" }}>\n      {conv.map((c,i) => <React.Fragment key={c.l}>\n        <span><b style={{ color:P.dim, fontWeight:700, fontVariantNumeric:\"tabular-nums\" }}>{c.v}%<\u002Fb> {c.l}<\u002Fspan>\n        {i<2 && <span style={{ color:P.ghost }}>&rarr;<\u002Fspan>}\n      <\u002FReact.Fragment>)}\n      <span style={{ color:P.ghost }}>&middot;<\u002Fspan>\n      <span>{links.length} links on this event<\u002Fspan>\n    <\u002Fdiv>\n  <\u002FCard>;\n}\n\n// ---------- WHO DELIVERS (venue-wide leaderboard) ----------\nfunction Delivers({ range, setRange }) {\n  const rows = INF[range];\n  return <div>\n    <SectionHead kicker=\"Section 1\" title=\"Who actually delivers\" sub=\"Ranked by checked-in headcount, across every event\"\n      right={<div style={{ display:\"inline-flex\", gap:3, padding:3, borderRadius:11, background:P.bg, border:\"1px solid \"+P.line }}>\n        {RANGES.map((r) => { const on = range === r; return <button key={r} className=\"pbtn\" onClick={() => setRange(r)} style={{ padding:\"8px 13px\", borderRadius:8, border:\"none\", background:on?P.accDim:\"transparent\", color:on?P.acc:P.faint, fontFamily:P.disp, fontWeight:700, fontSize:13, whiteSpace:\"nowrap\" }}>{r}<\u002Fbutton>; })}\n      <\u002Fdiv>} />\n    <Paginated key={range} items={rows} pageSize={6} unit=\"influencers\"\n      render={(r,gi) => <PerfRow key={r.name} rank={gi+1} name={r.name} sub={r.links+\" links · \"+r.events+\" events\"} f={r.f} />} />\n  <\u002Fdiv>;\n}\n\n// ---------- NO INFLUENCER ----------\nfunction NoInfluencer({ range }) {\n  const rows = NOINF[range];\n  return <div>\n    <SectionHead kicker=\"Section 1 · unattributed\" title=\"No influencer\" sub=\"Label-only links you shared yourself\" />\n    <Paginated key={range} items={rows} pageSize={5} unit=\"links\"\n      render={(r) => <PerfRow key={r.name} name={r.name} sub=\"Label-only link\" f={r.f} isLabel />} />\n  <\u002Fdiv>;\n}\n\n// ---------- PER EVENT ----------\nfunction PerEvent({ event, onCreate }) {\n  const links = (FUNNEL[event] || []).slice().sort((a,b) => b.f[3]-a.f[3]);\n  return <div>\n    <SectionHead kicker=\"Section 2\" title=\"Per-event funnel\" sub={\"Every request link on \" + event}\n      right={<button className=\"pbtn\" onClick={onCreate} style={{ display:\"inline-flex\", alignItems:\"center\", gap:7, padding:\"9px 14px\", borderRadius:11, background:P.elev2, border:\"1px solid \"+P.line, color:P.text, fontFamily:P.disp, fontWeight:700, fontSize:13.5, whiteSpace:\"nowrap\" }}><I d=\"plus\" size={15} c={P.acc} sw={2.3} />New link<\u002Fbutton>} />\n    <Paginated key={event} items={links} pageSize={5} unit=\"links\"\n      render={(l,gi) => <PerfRow key={gi} name={l.name} isLabel={l.label}\n        sub={l.label ? \"Label-only link\" : \"Request link\"}\n        chips={<span style={{ display:\"inline-flex\", gap:6 }}>\n          {l.auto && <MiniChip><I d=\"bolt\" size={10} c={P.dim} sw={2.2} />Auto<\u002FMiniChip>}\n          {l.cap != null && <MiniChip accent><I d=\"check\" size={10} c={P.acc} sw={2.6} />{l.f[2]}/{l.cap} full<\u002FMiniChip>}\n        <\u002Fspan>}\n        f={l.f} />} />\n  <\u002Fdiv>;\n}\n\n// ---------- STATES ----------\nfunction EmptyState({ onCreate }) {\n  return <Card style={{ padding:\"44px 26px\", textAlign:\"center\", display:\"flex\", flexDirection:\"column\", alignItems:\"center\", gap:16 }}>\n    <div style={{ width:60, height:60, borderRadius:18, background:P.elev2, border:\"1px dashed \"+P.line, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", color:P.acc }}><I d=\"link\" size={26} /><\u002Fdiv>\n    <div>\n      <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:19, letterSpacing:\"-0.01em\" }}>No links yet<\u002Fdiv>\n      <div style={{ fontSize:13.5, color:P.dim, marginTop:6, maxWidth:250, marginLeft:\"auto\", marginRight:\"auto\", lineHeight:1.5 }}>Create a request link on your event and share it — the moment people start requesting, this is where you'll see who's pulling.<\u002Fdiv>\n    <\u002Fdiv>\n    <button className=\"pbtn\" onClick={onCreate} style={{ display:\"inline-flex\", alignItems:\"center\", gap:8, padding:\"12px 18px\", borderRadius:13, background:P.acc, color:P.onAcc, border:\"none\", fontFamily:P.disp, fontWeight:700, fontSize:15 }}><I d=\"plus\" size={18} c={P.onAcc} sw={2.3} />Create request link<\u002Fbutton>\n  <\u002FCard>;\n}\n\n// ---------- TOGGLE ----------\nfunction Toggle({ on, onClick }) {\n  return <button className=\"pbtn\" onClick={onClick} style={{ width:44, height:26, borderRadius:99, border:\"none\", background: on?P.acc:P.elev2, boxShadow: on?\"none\":\"inset 0 0 0 1px \"+P.line, position:\"relative\", flexShrink:0, cursor:\"pointer\", padding:0 }}>\n    <span style={{ position:\"absolute\", top:3, left: on?21:3, width:20, height:20, borderRadius:99, background: on?P.onAcc:P.faint, transition:\"left .18s cubic-bezier(.16,1,.3,1)\" }} />\n  <\u002Fbutton>;\n}\n\n// ---------- CREATE REQUEST LINK FLOW ----------\nfunction CreateLinkModal({ event, onClose }) {\n  const [step, setStep] = React.useState(\"form\");\n  const [type, setType] = React.useState(\"influencer\");\n  const [name, setName] = React.useState(\"\");\n  const [auto, setAuto] = React.useState(true);\n  const [capOn, setCapOn] = React.useState(false);\n  const [cap, setCap] = React.useState(25);\n  const [copied, setCopied] = React.useState(false);\n  const tiers = TIERS[event] || TIERS._default;\n  const [tier, setTier] = React.useState(tiers[0]);\n  const slug = (name.trim().toLowerCase().replace(/[^a-z0-9]+/g,\"-\").replace(/^-+|-+$/g,\"\")) || \"link\";\n  const url = \"req.plusone.app/frenzy/\" + slug;\n  const inp = { width:\"100%\", background:P.bg, border:\"1px solid \"+P.line, borderRadius:12, padding:\"12px 14px\", color:P.text, fontSize:14.5, fontFamily:P.body, outline:\"none\" };\n  const stepBtn = { width:38, height:38, borderRadius:11, border:\"1px solid \"+P.line, background:P.elev2, color:P.text, fontFamily:P.disp, fontWeight:700, fontSize:20, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", lineHeight:1 };\n  const ready = name.trim().length > 0;\n\n  return <div onClick={onClose} style={{ position:\"absolute\", inset:0, zIndex:50, background:\"rgba(6,6,8,0.66)\", backdropFilter:\"blur(3px)\", display:\"flex\", alignItems:\"center\", justifyContent:\"center\", padding:20 }}>\n    <div className=\"modal-card\" onClick={(e) => e.stopPropagation()} style={{ width:\"100%\", maxWidth:360, background:P.elev, border:\"1px solid \"+P.line, borderRadius:20, padding:22, boxShadow:\"0 30px 90px rgba(0,0,0,0.6)\", display:\"flex\", flexDirection:\"column\", gap:16, maxHeight:\"88%\", overflowY:\"auto\" }}>\n      {step === \"form\" ? <React.Fragment>\n        <div style={{ display:\"flex\", alignItems:\"flex-start\", justifyContent:\"space-between\", gap:12 }}>\n          <div>\n            <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:19, letterSpacing:\"-0.01em\" }}>Create request link<\u002Fdiv>\n            <div style={{ fontSize:12.5, color:P.faint, marginTop:3 }}>Share it — every request routes back to you.<\u002Fdiv>\n          <\u002Fdiv>\n          <button className=\"pbtn\" onClick={onClose} style={{ width:32, height:32, borderRadius:10, border:\"1px solid \"+P.line, background:\"transparent\", color:P.faint, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", flexShrink:0 }}><I d=\"x\" size={16} /><\u002Fbutton>\n        <\u002Fdiv>\n        <div>\n          <Lbl style={{ marginBottom:8 }}>Event<\u002FLbl>\n          <div style={{ ...inp, display:\"flex\", alignItems:\"center\", justifyContent:\"space-between\", gap:9 }}>\n            <span style={{ display:\"inline-flex\", alignItems:\"center\", gap:9, fontWeight:600 }}><I d=\"cal\" size={16} c={P.acc} />{event}<\u002Fspan>\n            <I d=\"chevD\" size={15} c={P.ghost} />\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <Lbl style={{ marginBottom:8 }}>Attach to<\u002FLbl>\n          <div style={{ display:\"flex\", gap:3, padding:3, borderRadius:11, background:P.bg, border:\"1px solid \"+P.line }}>\n            {[[\"influencer\",\"Influencer\"],[\"label\",\"Label only\"]].map(([k,l]) => { const on = type===k; return <button key={k} className=\"pbtn\" onClick={() => setType(k)} style={{ flex:1, padding:\"9px 0\", borderRadius:8, border:\"none\", background:on?P.accDim:\"transparent\", color:on?P.acc:P.faint, fontFamily:P.disp, fontWeight:700, fontSize:13.5 }}>{l}<\u002Fbutton>; })}\n          <\u002Fdiv>\n          <input value={name} onChange={(e) => setName(e.target.value)} placeholder={type===\"influencer\" ? \"Influencer name\" : \"Link label — e.g. Instagram bio\"} style={{ ...inp, marginTop:10 }} />\n        <\u002Fdiv>\n        <div>\n          <Lbl style={{ marginBottom:8 }}>Ticket / tier<\u002FLbl>\n          <div style={{ display:\"flex\", gap:3, padding:3, borderRadius:11, background:P.bg, border:\"1px solid \"+P.line }}>\n            {tiers.map((t) => { const on = tier===t; return <button key={t} className=\"pbtn\" onClick={() => setTier(t)} style={{ flex:1, minWidth:0, padding:\"9px 4px\", borderRadius:8, border:\"none\", background:on?P.accDim:\"transparent\", color:on?P.acc:P.faint, fontFamily:P.disp, fontWeight:700, fontSize:12.5, whiteSpace:\"nowrap\", overflow:\"hidden\", textOverflow:\"ellipsis\" }}>{t}<\u002Fbutton>; })}\n          <\u002Fdiv>\n          <div style={{ fontSize:12, color:P.faint, marginTop:8, lineHeight:1.4 }}>Guests on this link get the <b style={{ color:P.dim, fontWeight:700 }}>{tier}<\u002Fb> ticket for {event}.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style={{ display:\"flex\", alignItems:\"center\", gap:12 }}>\n          <div style={{ flex:1 }}>\n            <div style={{ fontSize:14, fontWeight:600 }}>Auto-approve requests<\u002Fdiv>\n            <div style={{ fontSize:12, color:P.faint, marginTop:2, lineHeight:1.4 }}>Everyone who requests gets in — no manual review.<\u002Fdiv>\n          <\u002Fdiv>\n          <Toggle on={auto} onClick={() => setAuto(!auto)} />\n        <\u002Fdiv>\n        <div>\n          <div style={{ display:\"flex\", alignItems:\"center\", gap:12 }}>\n            <div style={{ flex:1 }}>\n              <div style={{ fontSize:14, fontWeight:600 }}>Set a capacity<\u002Fdiv>\n              <div style={{ fontSize:12, color:P.faint, marginTop:2, lineHeight:1.4 }}>Close the link once it's full.<\u002Fdiv>\n            <\u002Fdiv>\n            <Toggle on={capOn} onClick={() => setCapOn(!capOn)} />\n          <\u002Fdiv>\n          {capOn && <div style={{ display:\"flex\", alignItems:\"center\", gap:10, marginTop:13 }}>\n            <button className=\"pbtn\" onClick={() => setCap(Math.max(1,cap-1))} style={stepBtn}>&minus;<\u002Fbutton>\n            <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:22, minWidth:56, textAlign:\"center\", fontVariantNumeric:\"tabular-nums\" }}>{cap}<\u002Fdiv>\n            <button className=\"pbtn\" onClick={() => setCap(cap+1)} style={stepBtn}>+<\u002Fbutton>\n            <span style={{ fontSize:13, color:P.faint, marginLeft:4 }}>spots<\u002Fspan>\n          <\u002Fdiv>}\n        <\u002Fdiv>\n        <button className=\"pbtn\" onClick={() => ready && setStep(\"done\")} style={{ marginTop:2, width:\"100%\", justifyContent:\"center\", display:\"inline-flex\", alignItems:\"center\", gap:8, padding:\"13px 18px\", borderRadius:13, background:P.acc, color:P.onAcc, border:\"none\", fontFamily:P.disp, fontWeight:700, fontSize:15, opacity: ready?1:0.4, pointerEvents: ready?\"auto\":\"none\" }}><I d=\"link\" size={17} c={P.onAcc} sw={2.2} />Create link<\u002Fbutton>\n      <\u002FReact.Fragment> : <React.Fragment>\n        <div style={{ display:\"flex\", justifyContent:\"flex-end\" }}>\n          <button className=\"pbtn\" onClick={onClose} style={{ width:32, height:32, borderRadius:10, border:\"1px solid \"+P.line, background:\"transparent\", color:P.faint, display:\"flex\", alignItems:\"center\", justifyContent:\"center\" }}><I d=\"x\" size={16} /><\u002Fbutton>\n        <\u002Fdiv>\n        <div style={{ display:\"flex\", flexDirection:\"column\", alignItems:\"center\", textAlign:\"center\", gap:10, marginTop:-6 }}>\n          <div data-anim style={{ width:56, height:56, borderRadius:17, background:P.accDim, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", color:P.acc, animation:\"floaty 2.4s ease-in-out infinite\" }}><I d=\"check\" size={27} sw={2.4} /><\u002Fdiv>\n          <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:20, letterSpacing:\"-0.01em\" }}>Your link is live<\u002Fdiv>\n          <div style={{ fontSize:13, color:P.dim, maxWidth:250, lineHeight:1.5 }}>{(name.trim() || (type===\"influencer\"?\"This influencer\":\"This label\"))} can start pulling for {event} — every guest gets the {tier} ticket.{auto ? \" Requests auto-approve.\" : \"\"}{capOn ? \" Capped at \"+cap+\".\" : \"\"}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style={{ ...inp, display:\"flex\", alignItems:\"center\", gap:9 }}>\n          <I d=\"link\" size={16} c={P.faint} />\n          <span style={{ flex:1, minWidth:0, fontSize:13.5, color:P.text, whiteSpace:\"nowrap\", overflow:\"hidden\", textOverflow:\"ellipsis\", fontFamily:P.body }}>{url}<\u002Fspan>\n          <button className=\"pbtn\" onClick={() => { setCopied(true); try { navigator.clipboard.writeText(url); } catch(e) {} }} style={{ display:\"inline-flex\", alignItems:\"center\", gap:5, padding:\"7px 11px\", borderRadius:9, border:\"none\", background:copied?P.accDim:P.acc, color:copied?P.acc:P.onAcc, fontFamily:P.disp, fontWeight:700, fontSize:12.5, flexShrink:0 }}><I d={copied?\"check\":\"copy\"} size={13} c={copied?P.acc:P.onAcc} sw={2.3} />{copied?\"Copied\":\"Copy\"}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style={{ display:\"flex\", gap:10 }}>\n          <button className=\"pbtn\" onClick={() => { setStep(\"form\"); setName(\"\"); setCopied(false); }} style={{ flex:1, justifyContent:\"center\", display:\"inline-flex\", alignItems:\"center\", padding:\"12px 0\", borderRadius:13, background:\"transparent\", color:P.text, border:\"1px solid \"+P.line, fontFamily:P.disp, fontWeight:700, fontSize:14.5 }}>Create another<\u002Fbutton>\n          <button className=\"pbtn\" onClick={onClose} style={{ flex:1, justifyContent:\"center\", display:\"inline-flex\", alignItems:\"center\", padding:\"12px 0\", borderRadius:13, background:P.acc, color:P.onAcc, border:\"none\", fontFamily:P.disp, fontWeight:700, fontSize:14.5 }}>Done<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002FReact.Fragment>}\n    <\u002Fdiv>\n  <\u002Fdiv>;\n}\n\n// ---------- LOADING ----------\nfunction LoadingState() {\n  const bars = [100, 78, 58, 42];\n  return <Card style={{ padding:\"38px 26px\", overflow:\"hidden\" }}>\n    <div style={{ display:\"flex\", flexDirection:\"column\", alignItems:\"center\", gap:24 }}>\n      <div style={{ width:\"100%\", maxWidth:270, display:\"flex\", flexDirection:\"column\", gap:12 }}>\n        {bars.map((w,i) => { const last = i===3; return <div key={i} data-anim style={{ alignSelf:\"center\", width:w+\"%\", height:20, borderRadius:7, background:P.elev2, overflow:\"hidden\", position:\"relative\", animation:\"barPulse 1.6s ease-in-out infinite\", animationDelay:(i*0.12)+\"s\" }}>\n          <div data-anim style={{ position:\"absolute\", inset:0, width:\"45%\", borderRadius:7, background:\"linear-gradient(90deg, transparent, \"+(last?P.acc:\"rgba(255,255,255,0.24)\")+\", transparent)\", animation:\"sweep 1.3s ease-in-out infinite\", animationDelay:(i*0.12)+\"s\" }} />\n        <\u002Fdiv>; })}\n      <\u002Fdiv>\n      <div style={{ textAlign:\"center\" }}>\n        <div style={{ fontFamily:P.disp, fontWeight:800, fontSize:18, letterSpacing:\"-0.01em\" }}>Counting who came through the door<\u002Fdiv>\n        <div style={{ fontSize:13, color:P.faint, marginTop:6 }}>Crunching views, requests and check-ins<span className=\"d1\">.<\u002Fspan><span className=\"d2\">.<\u002Fspan><span className=\"d3\">.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002FCard>;\n}\n\n// ---------- APP-SHELL TOP BAR (context only) ----------\nfunction TopBar({ w }) {\n  return <div style={{ display:\"flex\", alignItems:\"center\", gap:14, padding: w<500? \"16px 20px\" : \"18px 28px\", borderBottom:\"1px solid \"+P.line2, background:\"rgba(11,11,13,0.85)\" }}>\n    <div style={{ width:32, height:32, borderRadius:10, background:P.acc, display:\"flex\", alignItems:\"center\", justifyContent:\"center\", fontFamily:P.disp, fontWeight:800, fontSize:15, color:P.onAcc, letterSpacing:\"-0.03em\" }}>+1<\u002Fdiv>\n    <div style={{ fontFamily:P.disp, fontWeight:800, fontSize: w<500?19:21, letterSpacing:\"-0.02em\" }}>Promotion<\u002Fdiv>\n    <div style={{ flex:1 }} />\n    <span style={{ display:\"inline-flex\", alignItems:\"center\", gap:7, fontSize:12.5, fontWeight:700, color:P.dim, fontFamily:P.body, padding:\"7px 12px\", borderRadius:10, border:\"1px solid \"+P.line }}><span style={{ width:7, height:7, borderRadius:99, background:P.acc }} />LOFI<\u002Fspan>\n  <\u002Fdiv>;\n}\n\n// ---------- SCREENS ----------\nfunction Screen({ w }) {\n  const [range, setRange] = React.useState(\"30 days\");\n  const [event, setEvent] = React.useState(EVENTS[0]);\n  const [open, setOpen] = React.useState(false);\n  const [creating, setCreating] = React.useState(false);\n  const pad = w<500 ? \"18px 16px 30px\" : \"26px 30px 40px\";\n  return <div style={{ width:w, background:P.bg, borderRadius:20, border:\"1px solid \"+P.line, overflow:\"hidden\", position:\"relative\" }} className=\"frame\">\n    <TopBar w={w} />\n    <div style={{ padding:pad, display:\"flex\", flexDirection:\"column\", gap:30, maxWidth:760, margin:\"0 auto\" }}>\n      <Overview event={event} setEvent={setEvent} open={open} setOpen={setOpen} w={w} />\n      <Delivers range={range} setRange={setRange} />\n      <NoInfluencer range={range} />\n      <PerEvent event={event} onCreate={() => setCreating(true)} />\n    <\u002Fdiv>\n    {creating && <CreateLinkModal event={event} onClose={() => setCreating(false)} />}\n  <\u002Fdiv>;\n}\nfunction EmptyFrame({ initialOpen }) {\n  const [creating, setCreating] = React.useState(!!initialOpen);\n  return <div style={{ width:390, background:P.bg, borderRadius:20, border:\"1px solid \"+P.line, overflow:\"hidden\", position:\"relative\" }} className=\"frame\">\n    <TopBar w={390} />\n    <div style={{ padding:\"18px 16px 28px\", display:\"flex\", flexDirection:\"column\", gap:16 }}>\n      <SectionHead kicker=\"Section 2\" title=\"Per-event funnel\" />\n      <EmptyState onCreate={() => setCreating(true)} />\n    <\u002Fdiv>\n    {creating && <CreateLinkModal event={EVENTS[0]} onClose={() => setCreating(false)} />}\n  <\u002Fdiv>;\n}\nfunction StateFrame({ kicker, title, children }) {\n  return <div style={{ width:390, background:P.bg, borderRadius:20, border:\"1px solid \"+P.line, overflow:\"hidden\" }} className=\"frame\">\n    <TopBar w={390} />\n    <div style={{ padding:\"18px 16px 28px\", display:\"flex\", flexDirection:\"column\", gap:16 }}>\n      <SectionHead kicker={kicker} title={title} />\n      {children}\n    <\u002Fdiv>\n  <\u002Fdiv>;\n}\nfunction Frame({ x, y, cap, children }) {\n  return <div style={{ position:\"absolute\", left:x, top:y }}>\n    <div className=\"cap\">{cap}<\u002Fdiv>\n    {children}\n  <\u002Fdiv>;\n}\nfunction Canvas() {\n  return <React.Fragment>\n    <Frame x={0} y={60} cap=\"Desktop · 1080 — overview-first single column\"><Screen w={1080} /><\u002FFrame>\n    <Frame x={1160} y={60} cap=\"Mobile · 390\"><Screen w={390} /><\u002FFrame>\n    <Frame x={1600} y={60} cap=\"Empty state\"><EmptyFrame /><\u002FFrame>\n    <Frame x={2040} y={60} cap=\"Create request link flow\"><EmptyFrame initialOpen /><\u002FFrame>\n    <Frame x={2480} y={60} cap=\"Loading state\"><StateFrame kicker=\"Section 1\" title=\"Who actually delivers\"><LoadingState /><\u002FStateFrame><\u002FFrame>\n  <\u002FReact.Fragment>;\n}\nReactDOM.createRoot(document.getElementById(\"root\")).render(<Canvas />);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
